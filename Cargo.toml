[package]
name = "scala-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Scala as a fusevm frontend: lexer, parser, and compiler to fusevm::Chunk, run on the shared three-tier Cranelift JIT — no bespoke VM or JVM"
license = "MIT"
documentation = "https://docs.rs/scala-rs"
authors = ["MenkeTechnologies <linux.dev25.com>"]
repository = "https://github.com/MenkeTechnologies/scalars"
homepage = "https://menketechnologies.github.io/scalars/"
readme = "README.md"
keywords = ["scala", "compiler", "jit", "fusevm", "bytecode"]
categories = ["command-line-utilities", "compilers"]
publish = true
# Dev-only artifacts kept out of the published crate. Consumers get src + the
# `scala` bin — not CI config, the integration-test corpus, or the .scala
# examples. None are referenced at compile time (no include_str! into them), so
# the packaged crate still builds and its bin runs.
exclude = [
    "/.github/",
    "/tests/",
    "/examples/",
    "/docs/",
]

# scalars is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "scalars"
path = "src/lib.rs"

[[bin]]
name = "scala"
path = "src/main.rs"

# Offline generator for docs/reference.html — renders the keyword/builtin
# reference (src/lsp.rs corpus) as a static page. Run before pushing Pages.
[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

# Differential parity FUZZER: generates deterministic-output Scala programs (each
# packing many probes to amortize the reference toolchain's JVM startup) biased
# toward Int-vs-Double division dispatch, `+` concatenation coercion, structural
# `==`, Double.toString notation, and range `for`, then diffs `scala <file>`
# against this frontend. Development tool — needs a real `scala` on PATH (or
# `SCALARS_FUZZ_SCALA`), so CI never builds it; its frozen outputs live in
# tests/data/parity_expected.txt, which tests/parity.rs replays with no Scala
# toolchain installed.
[[bin]]
name = "parity-fuzz"
path = "src/bin/parity_fuzz.rs"

[dependencies]
# Scala executes on fusevm. scalars is a pure frontend: it lexes/parses Scala and
# lowers it to fusevm bytecode (src/compiler.rs). There is no local vm.rs/jit.rs
# and no JVM — execution and codegen live in the shared engine behind zshrs,
# stryke, awkrs, elisp, ruby.
#
# `jit-disk-cache` turns on fusevm's three-tier Cranelift JIT *and* its
# persistent on-disk cache of compiled native code (keyed by chunk hash), so hot
# Scala loops trace-compile and warm runs skip recompilation. `aot` enables the
# ahead-of-time object emitter used by later `scala --build` work.
#
# `ffi` enables fusevm's inline-Rust FFI bridge: a `rust { pub extern "C" fn … }`
# block in Scala source is scanned/rewritten by `fusevm::RustSugar`
# (src/rust_ffi.rs), compiled to a cdylib, and its exports are called by name
# (the `__rust_compile` / by-name-call dispatch into `fusevm::ffi`).
fusevm = { version = "0.14.12", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

thiserror = "2.0"

# LSP (`scala --lsp`) + DAP (`scala --dap`) over stdio. libc gives the DAP server
# a pipe + dup2 to capture the debuggee's stdout (println) so program output
# streams as `output` events instead of corrupting the JSON-RPC channel, and
# backs the LSP orphan guard.
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
